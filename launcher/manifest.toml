# Pinned components. Every download is verified against its SHA-256 (ADR-014, RF-71).
# Platform keys: <os>-<arch> with os in linux|darwin|windows and arch in x64|arm64.

min_free_gb = 2          # M0: Python, Node, dependencies, build. Raised when models arrive (M4b).
port_range = [8000, 8100]

[node]
version = "24.22.2"
