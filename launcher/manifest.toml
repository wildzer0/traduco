# Ollama model tags (docs/02-architettura.md, hardware table). The three tags were checked against the
# Ollama library on 2026-11-07 (ollama.com/library/gemma4/tags); sizes are the download sizes, rounded up.
[models.small]
tag = "gemma4:e2b"
size_gb = 5
[models.default]
tag = "gemma4:e4b"
size_gb = 7
[models.large]
tag = "gemma4:26b-a4b"
size_gb = 16

[ollama]
host = "http://127.0.0.1:11434"

# Built-in engine (ADR-041): llama.cpp's llama-server (MIT) run by the launcher when Ollama is not
# wanted or cannot be installed. CPU builds (macOS builds include Metal). Release b12189, checked
# against the SHA-256 that GitHub publishes for each asset on 2026-11-07; only linux-x64 was
# downloaded and hashed here.
[llamacpp]
version = "b12189"
[llamacpp.platforms.linux-x64]
