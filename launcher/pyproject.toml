[project]
name = "traduco-launcher"
version = "0.1.0"
description = "Traduco one-command installer and launcher"
requires-python = "==3.12.*"
license = { text = "Apache-2.0" }
dependencies = ["rich==15.0.0"]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.4", "mypy==2.4.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["launcher"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
