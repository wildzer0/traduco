[project]
name = "traduco-backend"
version = "0.1.0"
description = "Traduco backend"
requires-python = "==3.12.*"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "pydantic==2.14.3",
  "pydantic-settings==2.16.2",
]

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1.post1",
  "httpx==0.28.1",
  "ruff==0.17.4",
  "mypy==2.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "app.core.*"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
