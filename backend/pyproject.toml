[project]
name = "traduco-backend"
version = "0.1.0"
description = "Traduco backend"
requires-python = "==3.12.*"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "pydantic==2.14.3",
  "pydantic-settings==2.16.2",
  "ruamel-yaml==0.19.1",
  "watchfiles==1.3.0",
  "websockets==17.4",
  "markdown-it-py==4.2.0",
  "mdit-py-plugins==0.6.1",
  "httpx==0.28.1",
  "python-docx==1.2.0",
  "docxcompose==2.2.0",
  "lxml==6.1.3",
]

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1.post1",
  "httpx==0.28.1",
  "ruff==0.17.4",
  "mypy==2.4.1",
  "hypothesis==6.170.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "app.core.*"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[[tool.mypy.overrides]]
module = "fake_llm.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["lxml.*", "docxcompose.*"]
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
# the template factory is mostly literal Word XML
"tests/support/*" = ["E501"]
"app/core/templates/wizard.py" = ["E501"]  # literal Word XML
"app/core/export/web.py" = ["E501"]  # inline CSS and JavaScript
"**/make-big-project.py" = ["E501"]  # the text corpus of the generator
"**/benchmark-translation.py" = ["E501"]  # report lines
"tests/integration/test_import_api.py" = ["F811"]  # fixtures imported by name
"tests/integration/test_memory_api.py" = ["F811"]  # fixtures imported by name
"tests/integration/test_languages_api.py" = ["F811"]  # fixtures imported by name
"tests/integration/test_spellcheck_api.py" = ["F811"]  # fixtures imported by name
